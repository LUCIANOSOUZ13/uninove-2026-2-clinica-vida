<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clinica vida mais</title>
    <link rel="stylesheet" href="style.css">
</head>

<form class="form-agendamento" action="/agendamento" method="post">
  <fieldset>
    <legend>Dados do paciente</legend>
    <div class="form-grid">
      <div class="campo">
        <label for="nome">Luciano Huck</label>
        <input type="text" id="nome" name="nome" minlength="5" required>
      </div>
      <div class="campo">
        <label for="cpf">777.666.222.3</label>
        <input type="text" id="cpf" name="cpf"
               placeholder="000.000.000-00"
               pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>
      </div>
      <div class="campo">
        <label for="nascimento">23/05/2002</label>
        <input type="date" id="nascimento" name="nascimento" required>
      </div>
      <div class="campo">
        <label for="telefone">(11)4002-8922</label>
        <input type="tel" id="telefone" name="telefone" required>
      </div>
      <div class="campo">
        <label for="email">LucianoHuck88@gmail.com</label>
        <input type="email" id="email" name="email" required>
      </div>
    </div>
  </fieldset>
